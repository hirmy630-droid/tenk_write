<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>明日の服装予報</title>
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
            overflow-wrap: break-word;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* iOSショートカット上部のすりガラス帯（約50〜54px）を回避する安全余白 */
        .ios-shortcut-safe-top {
            padding-top: max(env(safe-area-inset-top, 20px), 54px);
        }

        .safe-area-bottom {
            padding-bottom: max(env(safe-area-inset-bottom, 16px), 20px);
        }

        .text-wrap-optimal {
            word-break: auto-phrase;
            overflow-wrap: anywhere;
            line-break: strict;
        }

        .ios-btn {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .ios-btn:active {
            transform: scale(0.97);
            filter: brightness(0.92);
        }

        .ios-loader {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #ff9500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 14px;
        }

        #ptrContainer {
            overflow: hidden;
            height: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: height 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: height;
        }
        #ptrContainer.ptr-dragging {
            transition: none;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="selection:bg-orange-500 selection:text-white">

    <!-- メイン画面（地点管理・設定） -->
    <div id="mainScreenContainer" class="hidden w-full max-w-sm mx-auto flex-1 flex flex-col justify-start space-y-4 p-4 ios-shortcut-safe-top safe-area-bottom overflow-y-auto">
        
        <header class="pt-2 pb-1 text-center relative">
            <button type="button" onclick="toggleSettingsModal(true)" class="ios-btn absolute right-0 top-1 text-[#4b5563] hover:text-[#1c1c1e] p-2 text-xl transition-colors" title="設定">
                ⚙
            </button>
            <h1 class="text-[22px] font-bold tracking-tight text-[#1c1c1e] flex items-center justify-center gap-1.5">
                明日の服装予報
            </h1>
            <p id="headerSubtitle" class="text-[13px] text-[#4b5563] mt-1 text-wrap-optimal font-medium">
                KYOWA ROOF
            </p>
        </header>

        <div class="bg-white border border-[#e5e5ea] rounded-2xl p-3.5 shadow-sm space-y-2.5">
            <div class="flex items-center justify-between px-1">
                <label for="locationInput" class="text-[14px] font-semibold text-[#374151] flex items-center gap-1.5">
                    <span>📍</span>
                    <span>登録場所の選択・管理</span>
                </label>
                <span id="saveStatus" class="text-[14px] text-[#34c759] font-semibold transition-opacity opacity-0">追加完了</span>
            </div>
            
            <div class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="locationInput" 
                    placeholder="市区町村・都道府県（例: 札幌、福岡）" 
                    class="flex-1 bg-[#f2f2f7] border border-[#d1d1d6] focus:border-[#007aff] text-[#1c1c1e] text-[14px] rounded-xl px-3 py-2 outline-none transition-colors duration-150 placeholder-[#4b5563]"
                    onkeydown="if(event.key === 'Enter') handleAddLocation()"
                >
                <button 
                    type="button" 
                    onclick="handleAddLocation()" 
                    class="ios-btn bg-[#007aff] hover:bg-[#0062cc] active:scale-95 text-white font-semibold text-[14px] px-3.5 py-2 rounded-xl shrink-0 transition-all shadow-sm flex items-center gap-1">
                    <span>追加</span>
                </button>
            </div>

            <div class="pt-0.5">
                <div id="locationList" class="space-y-1.5 max-h-[235px] overflow-y-auto pr-0.5"></div>
            </div>
        </div>

        <div class="bg-white border border-[#e5e5ea] rounded-2xl p-3.5 shadow-sm space-y-3">
            <div>
                <label class="text-[14px] font-semibold text-[#374151] block mb-1.5 px-0.5">
                    📅 判定する対象日を選択
                </label>
                <div class="grid grid-cols-2 gap-1.5 bg-[#e5e5ea]/60 p-1 rounded-xl border border-[#d1d1d6]/60">
                    <button 
                        type="button" 
                        id="mainTabToday"
                        onclick="setTargetDay('today')" 
                        class="ios-btn py-1.5 text-[14px] font-semibold rounded-lg transition-all text-[#4b5563] hover:text-[#1c1c1e]">
                        今日
                    </button>
                    <button 
                        type="button" 
                        id="mainTabTomorrow"
                        onclick="setTargetDay('tomorrow')" 
                        class="ios-btn py-1.5 text-[14px] font-semibold rounded-lg transition-all bg-[#ff9500] text-white shadow-sm">
                        明日
                    </button>
                </div>
            </div>

            <button 
                type="button"
                id="checkBtn" 
                onclick="showForecastView(false)" 
                class="ios-btn w-full bg-gradient-to-r from-[#ff9500] to-[#ff6a3a] hover:brightness-105 active:scale-[0.98] text-white font-semibold text-[16px] h-12 rounded-xl shadow-md transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
                <span id="checkBtnLabel">天気予報を見る</span>
            </button>

            <div id="loading" class="hidden py-6 flex flex-col items-center justify-center">
                <div class="ios-loader w-8 h-8 mb-3"></div>
                <p id="loadingText" class="text-[13px] font-semibold text-[#374151] text-wrap-optimal animate-pulse text-center">
                    気象庁データ ＆ 8-17時体感温度取得中...
                </p>
            </div>
        </div>

        <div id="errorBox" class="hidden bg-[#fee2e2] border border-[#f87171] rounded-2xl p-4 text-[14px] text-[#b91c1c] leading-relaxed text-wrap-optimal shadow-sm"></div>
    </div>

    <!-- 予報画面（完全分離ビュー） -->
    <div id="forecastScreenContainer" class="flex-1 flex flex-col bg-[#f2f2f7] safe-area-bottom h-full overflow-hidden">
        
        <!-- ナビゲーションバー（上部の安全余白付き） -->
        <div class="w-full bg-white border-b border-[#e5e5ea] shadow-xs ios-shortcut-safe-top shrink-0">
            <div class="max-w-sm mx-auto flex items-center justify-between px-3.5 pt-1.5 pb-2.5 gap-2">
                <div class="relative flex items-center flex-1 max-w-[240px]">
                    <span class="absolute left-2.5 pointer-events-none text-[14px]">📍</span>
                    <select 
                        id="resultLocationSelect" 
                        onchange="handleResultLocationSelect(this.value)" 
                        class="w-full appearance-none bg-[#f2f2f7] hover:bg-[#e5e5ea] text-[#1c1c1e] text-[14px] font-bold pl-7 pr-6 py-1.5 rounded-xl border border-[#d1d1d6] shadow-xs outline-none focus:border-[#ff9500] transition-all cursor-pointer truncate">
                    </select>
                    <span class="absolute right-2 pointer-events-none text-[#4b5563] text-[11px]">▼</span>
                </div>

                <div class="flex items-center shrink-0">
                    <button type="button" onclick="toggleOverviewModal(true)" class="ios-btn bg-[#f2f2f7] hover:bg-[#e5e5ea] text-[#1c1c1e] text-[14px] px-3 py-1.5 rounded-xl border border-[#d1d1d6] flex items-center gap-1 transition-all shadow-sm font-semibold">
                        <span>📅 週間</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- スクロールエリア -->
        <div id="resultScrollContainer" class="flex-1 overflow-y-auto px-3.5 py-2 space-y-2.5 max-w-sm w-full mx-auto overscroll-y-contain">
            
            <!-- Pull To Refresh -->
            <div id="ptrContainer" class="w-full">
                <div class="flex items-center justify-center gap-2 py-2 text-[#4b5563] text-[13px] font-medium">
                    <div id="ptrIcon" class="transition-transform duration-200 text-[#ff9500]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                        </svg>
                    </div>
                    <span id="ptrText">下に引いて最新情報を更新</span>
                </div>
            </div>

            <!-- 今日・明日切り替え -->
            <div class="grid grid-cols-2 gap-1 bg-[#e5e5ea]/70 p-1 rounded-xl border border-[#d1d1d6]">
                <button 
                    type="button" 
                    id="resTabToday"
                    onclick="switchResultDay('today')" 
                    class="ios-btn py-1 text-[14px] font-semibold rounded-lg transition-all text-[#4b5563]">
                    今日
                </button>
                <button 
                    type="button" 
                    id="resTabTomorrow"
                    onclick="switchResultDay('tomorrow')" 
                    class="ios-btn py-1 text-[14px] font-semibold rounded-lg transition-all bg-[#ff9500] text-white shadow-sm">
                    明日
                </button>
            </div>

            <!-- メイン天気カード -->
            <div class="bg-white rounded-2xl p-2.5 border border-[#e5e5ea] shadow-sm">
                <div class="flex flex-col items-center justify-center text-center pt-0.5 pb-1">
                    <div id="imageStyleDate" class="text-[20px] font-bold text-[#1c1c1e] tracking-wide mb-1">
                        --
                    </div>

                    <div id="imageStyleIcon" class="w-20 h-20 flex items-center justify-center my-0.5 select-none"></div>

                    <div class="flex items-center justify-center mt-1 mb-1">
                        <span id="imageStyleWeatherText" class="text-[21px] font-bold text-[#1c1c1e]">--</span>
                    </div>

                    <div class="flex items-baseline justify-center gap-6 text-[28px] font-bold mt-0.5 tracking-tight">
                        <div class="text-[#e03131] flex items-baseline">
                            <span id="imageStyleMaxTemp" class="leading-none">--</span><span class="text-[17px] font-normal leading-none">℃</span>
                        </div>
                        <div class="text-[#007aff] flex items-baseline">
                            <span id="imageStyleMinTemp" class="leading-none">--</span><span class="text-[17px] font-normal leading-none">℃</span>
                        </div>
                    </div>

                    <div class="mt-1.5 text-center">
                        <span class="inline-flex items-center gap-1 text-[14px] font-semibold text-orange-600 bg-orange-50 px-2.5 py-0.5 rounded-full border border-orange-200/70">
                            <span>体感温度:</span>
                            <span id="imageStyleApparentTemp" class="font-bold font-mono text-[15px]">--℃</span>
                        </span>
                    </div>
                </div>

                <!-- 降水確率＆風情報 -->
                <div class="mt-2 pt-2 border-t border-[#f2f2f7] space-y-2 text-[14px]">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[#374151] text-[15px] font-bold">降水確率 (6時間毎)</span>
                        </div>
                        <div id="subPop6hGrid" class="grid grid-cols-4 gap-1.5 text-center font-mono">
                            <div class="bg-[#f8f9fa] border border-[#d1d1d6] rounded-lg py-1">
                                <div class="text-[13px] text-[#4b5563] font-semibold">0-6時</div>
                                <div id="popSlot0" class="text-[15px] font-bold text-[#007aff]">--%</div>
                            </div>
                            <div class="bg-[#f8f9fa] border border-[#d1d1d6] rounded-lg py-1">
                                <div class="text-[13px] text-[#4b5563] font-semibold">6-12時</div>
                                <div id="popSlot1" class="text-[15px] font-bold text-[#007aff]">--%</div>
                            </div>
                            <div class="bg-[#f8f9fa] border border-[#d1d1d6] rounded-lg py-1">
                                <div class="text-[13px] text-[#4b5563] font-semibold">12-18時</div>
                                <div id="popSlot2" class="text-[15px] font-bold text-[#007aff]">--%</div>
                            </div>
                            <div class="bg-[#f8f9fa] border border-[#d1d1d6] rounded-lg py-1">
                                <div class="text-[13px] text-[#4b5563] font-semibold">18-24時</div>
                                <div id="popSlot3" class="text-[15px] font-bold text-[#007aff]">--%</div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center py-0.5">
                        <span class="text-[#374151] font-medium text-[14px]">風速</span>
                        <span id="subWindSpeed" class="text-cyan-700 font-mono font-bold text-[15px]">--</span>
                    </div>
                    <div class="flex justify-between items-center py-0.5">
                        <span class="text-[#374151] font-medium text-[14px]">風</span>
                        <span id="subWindDirection" class="text-[#1c1c1e] text-right truncate max-w-[230px] font-medium text-[15px]">--</span>
                    </div>
                </div>
            </div>

            <!-- 推奨服装カード -->
            <div class="bg-orange-50/70 rounded-2xl p-3 border border-orange-200 shadow-sm space-y-2">
                <div class="flex items-center justify-between border-b border-orange-200/60 pb-1.5">
                    <div class="flex items-center gap-1.5">
                        <span class="text-base">👔</span>
                        <h3 class="text-[15px] font-bold text-[#d97706] uppercase tracking-wider">推奨服装</h3>
                    </div>
                    <span id="criteriaBadge" class="text-[13px] bg-white px-2 py-0.5 rounded-lg border border-orange-200 text-[#374151] font-semibold">--</span>
                </div>
                <div id="outfitSection" class="space-y-1.5"></div>
                
                <div class="bg-white rounded-xl p-2.5 border border-[#e5e5ea] space-y-2 mt-2 shadow-xs">
                    <div class="flex items-center justify-between px-0.5">
                        <span class="font-bold text-[#d97706] text-[13px] flex items-center gap-1">
                            <span>🕒</span>
                            <span>朝・昼・夜の寒暖差</span>
                        </span>
                    </div>
                    <div id="timeTimeline" class="grid grid-cols-3 gap-1.5 text-center"></div>
                </div>

                <div id="accessoryAdvice" class="mt-2 bg-white/90 rounded-xl p-2.5 border border-orange-200/80 text-[14px] text-[#374151] shadow-xs leading-relaxed"></div>
            </div>

            <!-- 地点変更ボタンとKYOWA ROOF -->
            <div class="pt-2 pb-6 flex flex-col items-center">
                <button type="button" onclick="showMainScreen()" class="ios-btn w-full bg-white hover:bg-[#f2f2f7] text-[#1c1c1e] font-semibold text-[15px] h-11 rounded-xl border border-[#d1d1d6] shadow-xs transition-all flex items-center justify-center gap-1.5">
                    <span>📍</span>
                    <span>登録地点の追加・変更へ</span>
                </button>
                <p class="text-center text-[13px] text-[#8e8e93] font-semibold mt-3 tracking-wider select-none">
                    KYOWA ROOF
                </p>
            </div>
        </div>
    </div>

    <!-- 週間天気モーダル -->
    <div id="overviewModal" class="hidden fixed inset-0 z-[60] bg-black/40 backdrop-blur-sm flex items-center justify-center p-3.5">
        <div class="bg-white border border-[#e5e5ea] rounded-2xl p-4 w-full max-w-sm shadow-2xl space-y-3 flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between border-b border-[#e5e5ea] pb-2 shrink-0">
                <div class="flex items-center gap-1.5">
                    <span class="text-lg">📅</span>
                    <h3 id="jmaOverviewTitle" class="text-[17px] font-bold text-[#1c1c1e]">週間天気予報</h3>
                </div>
                <span id="jmaReportTimeBadge" class="text-[12px] text-[#4b5563] font-mono font-medium">--:-- 発表</span>
            </div>

            <div class="flex-1 overflow-y-auto pr-0.5">
                <div id="weeklyForecastList" class="divide-y divide-[#f2f2f7]"></div>
            </div>

            <div class="pt-1 shrink-0 border-t border-[#e5e5ea]">
                <button type="button" onclick="toggleOverviewModal(false)" class="ios-btn w-full bg-[#f2f2f7] hover:bg-[#e5e5ea] text-[#1c1c1e] font-semibold text-[15px] py-2 rounded-xl border border-[#d1d1d6] shadow-sm">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border border-[#e5e5ea] rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-[17px] font-bold text-[#1c1c1e]">⚙️ API詳細設定（任意）</h3>
                <button type="button" onclick="toggleSettingsModal(false)" class="ios-btn text-[#4b5563] hover:text-[#1c1c1e] text-lg">✕</button>
            </div>
            <p class="text-[14px] text-[#4b5563] leading-relaxed">
                気象庁公式データおよびOpen-Meteoを使用しているため、設定なしでもそのままご利用いただけます。
            </p>
            <div>
                <label for="userApiKey" class="text-[14px] font-semibold text-[#374151] mb-1 block">Gemini APIキー（設定すると高度な助言を追加可能）</label>
                <input 
                    type="password" 
                    id="userApiKey" 
                    placeholder="AI Studioのキー（空欄でOK）"
                    class="w-full bg-[#f2f2f7] border border-[#d1d1d6] text-[#1c1c1e] text-[14px] rounded-xl px-3 py-2 outline-none focus:border-[#007aff]"
                >
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="saveApiKeySettings()" class="ios-btn flex-1 bg-[#007aff] hover:bg-[#0062cc] text-white py-2 rounded-xl text-[14px] font-semibold transition-colors shadow-sm">保存する</button>
                <button type="button" onclick="toggleSettingsModal(false)" class="ios-btn bg-[#f2f2f7] hover:bg-[#e5e5ea] text-[#4b5563] px-4 py-2 rounded-xl text-[14px] transition-colors border border-[#d1d1d6]">キャンセル</button>
            </div>
        </div>
    </div>

    <script>

        const STORAGE_KEY_ACTIVE = 'weather_checker_active_location';
        const STORAGE_KEY_API_KEY = 'weather_checker_gemini_key';
        const STORAGE_KEY_SELECTED_DAY = 'weather_checker_selected_day';
        const DEFAULT_LOCATIONS = ['東京都品川区'];

        function evaluateClothingByCriteria(apparentTemp) {
            let label = '';
            let jacket = '';
            let pants = '';

            if (apparentTemp >= 25) {
                label = '25℃以上 (夏日・暖気)';
                jacket = '半袖シャツ';
                pants = 'ズボン';
            } else if (apparentTemp >= 20) {
                label = '20℃〜24℃ (過ごしやすい)';
                jacket = '長袖シャツ';
                pants = 'ズボン';
            } else if (apparentTemp >= 16) {
                label = '16℃〜19℃ (肌寒い・要羽織り)';
                jacket = 'インナーシャツ ＋ 長袖シャツ ＋ ジャケット';
                pants = 'ズボン';
            } else if (apparentTemp >= 11) {
                label = '11℃〜15℃ (晩秋・初春の冷え込み)';
                jacket = '防寒インナー ＋ 長袖シャツ ＋ 軽防寒服';
                pants = 'インナー ＋ ズボン';
            } else if (apparentTemp >= 6) {
                label = '6℃〜10℃ (冬の本格寒さ)';
                jacket = '防寒インナー ＋ 長袖シャツ ＋ ジャケット ＋ 軽防寒服';
                pants = '防寒インナー ＋ 軽防寒ズボン';
            } else {
                label = '5℃以下 (真冬の厳しい寒さ)';
                jacket = '防寒インナー ＋ 長袖シャツ ＋ 重防寒服（ダウン等）';

        function loadLocations() {
            const savedListJson = localStorage.getItem(STORAGE_KEY_LIST);
            if (savedListJson) {
                try {
                    locations = JSON.parse(savedListJson);
                } catch (e) {
                    locations = [...DEFAULT_LOCATIONS];
                }
            } else {
                locations = [...DEFAULT_LOCATIONS];
                saveLocationsToStorage();
            }

            if (!Array.isArray(locations) || locations.length === 0) {
                locations = ['東京都品川区'];
            }

            const savedActive = localStorage.getItem(STORAGE_KEY_ACTIVE);
            if (savedActive && locations.includes(savedActive)) {
                activeLocation = savedActive;
            } else {
                activeLocation = locations[0];
                localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
            }
        }

        function saveLocationsToStorage() {
            localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(locations));
            localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
        }

        function renderLocations() {
            const listEl = document.getElementById('locationList');
            if (!listEl) return;

            listEl.innerHTML = '';
            locations.forEach((loc) => {

                const item = document.createElement('div');
                item.className = `flex items-center justify-between px-3 py-2 rounded-xl border transition-all ${
                    isActive 
                        ? 'bg-orange-50/80 border-[#ff9500] text-[#1c1c1e] shadow-xs' 
                        : 'bg-[#f8f9fa] border-[#d1d1d6] text-[#374151] hover:bg-[#f2f2f7]'

                const textBtn = document.createElement('button');
                textBtn.type = 'button';
                textBtn.className = 'ios-btn flex-1 text-left flex items-center gap-2 text-[14px] font-medium outline-none truncate';
                textBtn.innerHTML = `
                    <span class="${isActive ? 'text-[#ff9500]' : 'text-transparent'} text-[14px] select-none font-bold">✓</span>
                    <span class="truncate ${isActive ? 'font-bold text-[#1c1c1e]' : ''}">${escapeHtml(loc)}</span>
                `;
                textBtn.onclick = () => {
                    selectLocation(loc);
                    showForecastView(false);
                };

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'ios-btn text-[#4b5563] hover:text-[#ff3b30] active:text-[#ff3b30] p-1.5 ml-2 rounded-lg text-[14px] transition-colors';
                delBtn.setAttribute('aria-label', `${loc}を削除`);
                delBtn.innerHTML = `

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                `;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    handleDeleteLocation(loc);

            });

            updateResultLocationSelect();

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        function handleAddLocation() {
            const input = document.getElementById('locationInput');
            const status = document.getElementById('saveStatus');
            const val = input?.value.trim();

            if (!val) return;

            if (!locations.includes(val)) {
                locations.unshift(val);
                activeLocation = val;
                saveLocationsToStorage();
                renderLocations();

                if (status) {
                    status.innerText = '追加完了';
                    status.classList.remove('opacity-0');
                    setTimeout(() => {
                        if (status) status.classList.add('opacity-0');
                    }, 1800);
                }
            } else {
                selectLocation(val);
            }

            if (input) {
                input.value = '';
                input.blur();
            }
        }

        function handleDeleteLocation(locToDelete) {
            if (locations.length <= 1) {
                const status = document.getElementById('saveStatus');
                if (status) {
                    status.innerText = '最後の1件は削除不可';
                    status.classList.remove('opacity-0');
                    setTimeout(() => {
                        if (status) status.classList.add('opacity-0');
                    }, 2000);
                }
                return;
            }

            locations = locations.filter(item => item !== locToDelete);
            if (activeLocation === locToDelete) {
                activeLocation = locations[0];
            }

            saveLocationsToStorage();
            renderLocations();
        }

        function initPullToRefresh() {
            const scrollContainer = document.getElementById('resultScrollContainer');
            const ptrContainer = document.getElementById('ptrContainer');
            const ptrIcon = document.getElementById('ptrIcon');
            const ptrText = document.getElementById('ptrText');

            if (!scrollContainer || !ptrContainer) return;

            let startY = 0;
            let currentPullDistance = 0;
            let isDragging = false;
            const PULL_THRESHOLD = 60;
            const MAX_PULL = 90;

            scrollContainer.addEventListener('touchstart', (e) => {
                if (isRefreshing) return;
                if (scrollContainer.scrollTop <= 0) {
                    startY = e.touches[0].clientY;
                    isDragging = true;
                    ptrContainer.classList.add('ptr-dragging');
                }
            }, { passive: true });

            scrollContainer.addEventListener('touchmove', (e) => {
                if (!isDragging || isRefreshing) return;

                const currentY = e.touches[0].clientY;
                const diff = currentY - startY;

                if (diff > 0 && scrollContainer.scrollTop <= 0) {
                    currentPullDistance = Math.min(diff * 0.45, MAX_PULL);
                    ptrContainer.style.height = `${currentPullDistance}px`;

                    if (currentPullDistance >= PULL_THRESHOLD) {
                        ptrText.innerText = '指を離して更新';
                        ptrIcon.style.transform = 'rotate(180deg)';
                    } else {
                        ptrText.innerText = '下に引いて最新情報を更新';
                        ptrIcon.style.transform = 'rotate(0deg)';
                    }
                } else {
                    currentPullDistance = 0;
                    ptrContainer.style.height = '0px';
                }
            }, { passive: true });

            const handleTouchEnd = async () => {
                if (!isDragging) return;
                isDragging = false;
                ptrContainer.classList.remove('ptr-dragging');

                if (currentPullDistance >= PULL_THRESHOLD && !isRefreshing) {
                    isRefreshing = true;
                    ptrContainer.style.height = '48px';
                    ptrIcon.style.transform = 'rotate(0deg)';
                    ptrIcon.innerHTML = `<div class="ios-loader w-4 h-4 border-2"></div>`;
                    ptrText.innerText = '最新データを更新中...';

                    try {
                        await fetchForecastData(true);
                        ptrText.innerText = '更新完了';
                    } catch (err) {
                        ptrText.innerText = '更新失敗';
                    } finally {
                        setTimeout(() => {
                            resetPtrUI();
                            isRefreshing = false;
                        }, 500);
                    }
                } else {
                    resetPtrUI();
                }
                currentPullDistance = 0;
            };

            scrollContainer.addEventListener('touchend', handleTouchEnd);
            scrollContainer.addEventListener('touchcancel', handleTouchEnd);

            function resetPtrUI() {
                ptrContainer.style.height = '0px';
                setTimeout(() => {
                    ptrIcon.className = 'transition-transform duration-200 text-[#ff9500]';
                    ptrIcon.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                        </svg>
                    `;
                    ptrText.innerText = '下に引いて最新情報を更新';
                }, 250);
            }
        }

        function initSwipeDaySwitcher() {
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;
            const SWIPE_THRESHOLD = 45;
            const RESTRAINT = 80;
            const MAX_TIME = 600;

            const handleTouchStart = (e) => {
                if (e.touches && e.touches.length === 1) {
                    touchStartX = e.touches[0].screenX;
                    touchStartY = e.touches[0].screenY;
                    touchStartTime = Date.now();
                }
            };

            const handleTouchEnd = (e) => {
                if (!e.changedTouches || e.changedTouches.length === 0) return;

                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const elapsedTime = Date.now() - touchStartTime;

                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                if (elapsedTime <= MAX_TIME && Math.abs(diffX) >= SWIPE_THRESHOLD && Math.abs(diffY) <= RESTRAINT) {
                    if (diffX < 0) {
                        if (selectedDay === 'today') {
                            switchResultDay('tomorrow');
                        }
                    } else {
                        if (selectedDay === 'tomorrow') {
                            switchResultDay('today');
                        }
                    }
                }
            };

            const forecastScreen = document.getElementById('forecastScreenContainer');
            if (forecastScreen) {
                forecastScreen.addEventListener('touchstart', handleTouchStart, { passive: true });
                forecastScreen.addEventListener('touchend', handleTouchEnd, { passive: true });
            }
        }

        async function fetchForecastData(isPullRefresh = false) {
            const btn = document.getElementById('checkBtn');
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('errorBox');
            const jmaOverviewTitle = document.getElementById('jmaOverviewTitle');
            const jmaReportTimeBadge = document.getElementById('jmaReportTimeBadge');
            const resultScroll = document.getElementById('resultScrollContainer');

            const targetLocation = activeLocation || '東京都品川区';

            updateResultLocationSelect();

            if (!isPullRefresh && btn && loading) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'pointer-events-none');
                loading.classList.remove('hidden');
                if (errorBox) errorBox.classList.add('hidden');
            }

            try {
                const areaInfo = resolveAreaAndCoords(targetLocation);
                const areaCode = areaInfo.code;
                const coords = { lat: areaInfo.lat, lon: areaInfo.lon };

                const todayStr = getTodayDateString();
                const tomorrowStr = getTomorrowDateString();

                const cacheBuster = `&_t=${Date.now()}`;
                const jmaForecastUrl = `https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json?_t=${Date.now()}`;
                const jmaOverviewUrl = `https://www.jma.go.jp/bosai/forecast/data/overview_forecast/${areaCode}.json?_t=${Date.now()}`;
                const meteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=weathercode,apparent_temperature_max,apparent_temperature_min,temperature_2m_max,temperature_2m_min,windspeed_10m_max,precipitation_probability_max&hourly=temperature_2m,apparent_temperature,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=10&past_days=1${cacheBuster}`;

                const [jmaForecastRes, jmaOverviewRes, meteoRes] = await Promise.all([
                    fetch(jmaForecastUrl).catch(() => null),
                    fetch(jmaOverviewUrl).catch(() => null),
                    fetch(meteoUrl).catch(() => null)
                ]);

                let overviewReportTime = '';
                let overviewTarget = '';

                if (jmaOverviewRes && jmaOverviewRes.ok) {
                    const overviewData = await jmaOverviewRes.json();
                    if (overviewData) {
                        overviewTarget = overviewData.targetArea || '';
                        if (overviewData.reportDatetime) {
                            const d = new Date(overviewData.reportDatetime);
                            overviewReportTime = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 発表`;
                        }
                    }
                }

                if (jmaOverviewTitle) jmaOverviewTitle.innerText = `週間天気（${overviewTarget || targetLocation}）`;
                if (jmaReportTimeBadge) jmaReportTimeBadge.innerText = overviewReportTime || '気象庁公式発表';

                let jmaData = null;
                if (jmaForecastRes && jmaForecastRes.ok) {
                    jmaData = await jmaForecastRes.json();
                }

                let meteoData = null;
                if (meteoRes && meteoRes.ok) {
                    meteoData = await meteoRes.json();
                }

                renderWeeklyList(meteoData, jmaData);

                const parseDayData = (dateStr, fallbackIdx, labelPrefix) => {
                    let weatherText = 'くもり';
                    let windText = '北寄りの風';
                    let maxTemp = null;
                    let minTemp = null;
                    let popList = [];
                    let targetDateFormatted = '';
                    let apparentTemp = null;
                    let maxWindSpeed = 3.0;
                    let morningTemp = null;
                    let noonTemp = null;
                    let nightTemp = null;
                    let dailyMaxPop = null;
                    let pop6h = [null, null, null, null];

                    const dObj = new Date(dateStr + 'T00:00:00');
                    const days = ['日', '月', '火', '水', '木', '金', '土'];
                    targetDateFormatted = `${labelPrefix} ${dObj.getMonth() + 1}/${dObj.getDate()} (${days[dObj.getDay()]})`;

                    if (Array.isArray(jmaData) && jmaData.length > 0) {
                        const weatherSeries = jmaData[0]?.timeSeries?.[0];
                        const area = weatherSeries?.areas?.[0];
                        const timeDefines = weatherSeries?.timeDefines || [];

                        let targetIdx = timeDefines.findIndex(t => t.startsWith(dateStr));
                        if (targetIdx === -1) {
                            targetIdx = Math.min(fallbackIdx, timeDefines.length - 1);
                        }

                        if (area?.weathers?.[targetIdx]) {
                            weatherText = area.weathers[targetIdx].replace(/\s+/g, ' ').trim();
                        }
                        if (area?.winds?.[targetIdx]) {
                            windText = area.winds[targetIdx].replace(/\s+/g, ' ').trim();
                        }

                        const popSeries = jmaData[0]?.timeSeries?.[1];
                        const popArea = popSeries?.areas?.[0];
                        const popDefines = popSeries?.timeDefines || [];

                        if (popArea?.pops) {
                            popDefines.forEach((t, idx) => {
                                if (t.startsWith(dateStr) && popArea.pops[idx] !== undefined && popArea.pops[idx] !== '') {
                                    const pVal = parseInt(popArea.pops[idx], 10);
                                    popList.push(`${pVal}%`);
                                    if (dailyMaxPop === null || pVal > dailyMaxPop) dailyMaxPop = pVal;

                                    if (t.includes('T00:00')) pop6h[0] = pVal;
                                    else if (t.includes('T06:00')) pop6h[1] = pVal;
                                    else if (t.includes('T12:00')) pop6h[2] = pVal;
                                    else if (t.includes('T18:00')) pop6h[3] = pVal;
                                }
                            });
                        }

                        const tempSeries = jmaData[0]?.timeSeries?.[2];
                        const tempArea = tempSeries?.areas?.[0];
                        const tempDefines = tempSeries?.timeDefines || [];
                        const tempVals = tempArea?.temps || [];

                        tempDefines.forEach((t, idx) => {
                            if (t.startsWith(dateStr) && tempVals[idx] !== undefined) {
                                const val = parseInt(tempVals[idx], 10);
                                if (minTemp === null || val < minTemp) minTemp = val;
                                if (maxTemp === null || val > maxTemp) maxTemp = val;
                            }
                        });

                        if ((minTemp === null || maxTemp === null) && jmaData[1]?.timeSeries?.[1]) {
                            const weekArea = jmaData[1].timeSeries[1].areas?.[0];
                            const weekDefines = jmaData[1].timeSeries[1].timeDefines || [];
                            const weekIdx = weekDefines.findIndex(t => t.startsWith(dateStr));
                            if (weekIdx !== -1 && weekArea) {
                                if (weekArea.tempsMin?.[weekIdx]) minTemp = parseInt(weekArea.tempsMin[weekIdx], 10);
                                if (weekArea.tempsMax?.[weekIdx]) maxTemp = parseInt(weekArea.tempsMax[weekIdx], 10);
                            }
                        }
                    }

                    const daily = meteoData?.daily;
                    if (daily && Array.isArray(daily.time)) {
                        let mIdx = daily.time.indexOf(dateStr);
                        if (mIdx !== -1) {
                            if (minTemp === null && daily.temperature_2m_min?.[mIdx] !== undefined) {
                                minTemp = Math.round(daily.temperature_2m_min[mIdx]);
                            }
                            if (maxTemp === null && daily.temperature_2m_max?.[mIdx] !== undefined) {
                                maxTemp = Math.round(daily.temperature_2m_max[mIdx]);
                            }
                            if (daily.windspeed_10m_max?.[mIdx] !== undefined) {
                                maxWindSpeed = parseFloat((daily.windspeed_10m_max[mIdx] / 3.6).toFixed(1));
                            }
                            if (dailyMaxPop === null && daily.precipitation_probability_max?.[mIdx] !== undefined) {
                                dailyMaxPop = daily.precipitation_probability_max[mIdx];
                            }
                        }
                    }

                    const hourly = meteoData?.hourly;
                    if (hourly && Array.isArray(hourly.time)) {
                        const mMorningIdx = hourly.time.indexOf(`${dateStr}T08:00`);
                        const mNoonIdx = hourly.time.indexOf(`${dateStr}T14:00`);
                        const mNightIdx = hourly.time.indexOf(`${dateStr}T20:00`);

                        if (mMorningIdx !== -1 && hourly.temperature_2m?.[mMorningIdx] !== undefined) {
                            morningTemp = Math.round(hourly.temperature_2m[mMorningIdx]);
                        }
                        if (mNoonIdx !== -1 && hourly.temperature_2m?.[mNoonIdx] !== undefined) {
                            noonTemp = Math.round(hourly.temperature_2m[mNoonIdx]);
                        }
                        if (mNightIdx !== -1 && hourly.temperature_2m?.[mNightIdx] !== undefined) {
                            nightTemp = Math.round(hourly.temperature_2m[mNightIdx]);
                        }

                        let daytimeApparentTemps = [];
                        for (let h = 8; h <= 17; h++) {
                            const timeKey = `${dateStr}T${String(h).padStart(2, '0')}:00`;
                            const idx = hourly.time.indexOf(timeKey);
                            if (idx !== -1 && hourly.apparent_temperature?.[idx] !== undefined) {
                                daytimeApparentTemps.push(hourly.apparent_temperature[idx]);
                            }
                        }

                        if (daytimeApparentTemps.length > 0) {
                            const sum = daytimeApparentTemps.reduce((acc, cur) => acc + cur, 0);
                            apparentTemp = Math.round(sum / daytimeApparentTemps.length);
                        }

                        const slotRanges = [
                            { start: 0, end: 5, index: 0 },
                            { start: 6, end: 11, index: 1 },
                            { start: 12, end: 17, index: 2 },
                            { start: 18, end: 23, index: 3 }
                        ];

                        slotRanges.forEach(slot => {
                            if (pop6h[slot.index] === null) {
                                let maxSlotPop = 0;
                                for (let h = slot.start; h <= slot.end; h++) {
                                    const timeKey = `${dateStr}T${String(h).padStart(2, '0')}:00`;
                                    const idx = hourly.time.indexOf(timeKey);
                                    if (idx !== -1 && hourly.precipitation_probability?.[idx] !== undefined) {
                                        if (hourly.precipitation_probability[idx] > maxSlotPop) {
                                            maxSlotPop = hourly.precipitation_probability[idx];
                                        }
                                    }
                                }
                                pop6h[slot.index] = maxSlotPop;
                            }
                        });
                    }

                    if (maxTemp === null) maxTemp = 20;
                    if (minTemp === null) minTemp = 14;
                    if (apparentTemp === null) {
                        apparentTemp = Math.round(maxTemp - (maxWindSpeed * 0.7));
                    }
                    if (morningTemp === null) morningTemp = minTemp + 2;
                    if (noonTemp === null) noonTemp = maxTemp;
                    if (nightTemp === null) nightTemp = minTemp + 3;
                    if (dailyMaxPop === null) dailyMaxPop = 10;

                    pop6h = pop6h.map(p => (p !== null ? p : dailyMaxPop));

                    return {
                        weatherText,
                        windText,
                        maxTemp,
                        minTemp,
                        popList,
                        dailyMaxPop,
                        targetDateFormatted,
                        apparentTemp,
                        maxWindSpeed,
                        morningTemp,
                        noonTemp,
                        nightTemp,
                        pop6h
                    };
                };

                const todayData = parseDayData(todayStr, 0, '今日');
                const tomorrowData = parseDayData(tomorrowStr, 1, '明日');

                cachedForecastData = {
                    today: todayData,
                    tomorrow: tomorrowData
                };
                lastFetchedTimestamp = Date.now();

                updateTabStyles();
                renderForecastView(cachedForecastData[selectedDay]);

                if (!isPullRefresh && resultScroll) {
                    resultScroll.scrollTop = 0;
                }

            } catch (err) {
                console.error("Forecast Error:", err);
                if (errorBox) {
                    errorBox.innerText = `データ取得中にエラーが発生しました: ${err.message}`;
                    errorBox.classList.remove('hidden');
                }
                throw err;
            } finally {
                if (!isPullRefresh && btn && loading) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'pointer-events-none');
                    loading.classList.add('hidden');
                }
            }
        }

        function renderWeeklyList(meteoData, jmaData) {
            const listContainer = document.getElementById('weeklyForecastList');
            if (!listContainer) return;

            const jmaWeekSeries = Array.isArray(jmaData) && jmaData.length > 1 ? jmaData[1]?.timeSeries : null;
            const jmaWeatherArea = jmaWeekSeries?.[0]?.areas?.[0];
            const jmaWeatherTimes = jmaWeekSeries?.[0]?.timeDefines || [];
            const jmaTempArea = jmaWeekSeries?.[1]?.areas?.[0];
            const jmaTempTimes = jmaWeekSeries?.[1]?.timeDefines || [];

            const meteoDaily = meteoData?.daily;
            const tomorrowStr = getTomorrowDateString();

            const targetDates = [];
            const baseTime = new Date(tomorrowStr + 'T00:00:00');
            for (let i = 0; i < 8; i++) {
                const target = new Date(baseTime.getTime() + i * 24 * 60 * 60 * 1000);
                const y = target.getFullYear();
                const m = String(target.getMonth() + 1).padStart(2, '0');
                const d = String(target.getDate()).padStart(2, '0');
                targetDates.push(`${y}-${m}-${d}`);
            }

            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

            const listHtml = targetDates.map((dateStr) => {
                const d = new Date(dateStr + 'T00:00:00');
                const dateNum = d.getDate();
                const dayIndex = d.getDay();
                const dayText = dayNames[dayIndex];

                let dayColorClass = 'text-[#374151]';
                if (dayIndex === 0) {
                    dayColorClass = 'text-[#e03131]';
                } else if (dayIndex === 6) {
                    dayColorClass = 'text-[#007aff]';
                }

                let maxT = null;
                let minT = null;
                let pop = null;
                let reliability = 'A';
                let weatherCode = null;

                const jmaWIdx = jmaWeatherTimes.findIndex(t => t.startsWith(dateStr));
                if (jmaWIdx !== -1 && jmaWeatherArea) {
                    weatherCode = jmaWeatherArea.weatherCodes?.[jmaWIdx];
                    if (jmaWeatherArea.pops?.[jmaWIdx] !== undefined && jmaWeatherArea.pops[jmaWIdx] !== '') {
                        pop = parseInt(jmaWeatherArea.pops[jmaWIdx], 10);
                    }
                    if (jmaWeatherArea.reliabilities?.[jmaWIdx]) {
                        reliability = jmaWeatherArea.reliabilities[jmaWIdx];
                    }
                }

                const jmaTIdx = jmaTempTimes.findIndex(t => t.startsWith(dateStr));
                if (jmaTIdx !== -1 && jmaTempArea) {
                    if (jmaTempArea.tempsMax?.[jmaTIdx] !== undefined && jmaTempArea.tempsMax[jmaTIdx] !== '') {
                        maxT = parseInt(jmaTempArea.tempsMax[jmaTIdx], 10);
                    }
                    if (jmaTempArea.tempsMin?.[jmaTIdx] !== undefined && jmaTempArea.tempsMin[jmaTIdx] !== '') {
                        minT = parseInt(jmaTempArea.tempsMin[jmaTIdx], 10);
                    }
                }

                if (meteoDaily && Array.isArray(meteoDaily.time)) {
                    const mIdx = meteoDaily.time.indexOf(dateStr);
                    if (mIdx !== -1) {
                        if (maxT === null && meteoDaily.temperature_2m_max?.[mIdx] !== undefined) {
                            maxT = Math.round(meteoDaily.temperature_2m_max[mIdx]);
                        }
                        if (minT === null && meteoDaily.temperature_2m_min?.[mIdx] !== undefined) {
                            minT = Math.round(meteoDaily.temperature_2m_min[mIdx]);
                        }
                        if (pop === null && meteoDaily.precipitation_probability_max?.[mIdx] !== undefined) {
                            pop = meteoDaily.precipitation_probability_max[mIdx];
                        }
                        if (!weatherCode && meteoDaily.weathercode?.[mIdx] !== undefined) {
                            weatherCode = meteoDaily.weathercode[mIdx];
                        }
                    }
                }

                if (pop === null) pop = 10;
                if (!reliability) {
                    reliability = pop >= 50 ? 'C' : (pop >= 30 ? 'B' : 'A');
                }

                const displayMax = maxT !== null ? maxT : '--';
                const displayMin = minT !== null ? minT : '--';
                const displayPop = `${pop}%`;
                const iconSvg = renderWeeklyListIcon(weatherCode, '');

                return `
                    <div class="flex items-center justify-between py-2.5 px-2 hover:bg-[#f8f9fa] transition-colors whitespace-nowrap">
                        <div class="flex items-center gap-1 shrink-0 font-medium whitespace-nowrap min-w-[64px]">
                            <span class="text-[17px] font-bold text-[#1c1c1e] min-w-[24px] text-right font-mono whitespace-nowrap leading-none">${dateNum}</span>
                            <span class="text-[16px] font-bold ${dayColorClass} whitespace-nowrap leading-none">(${dayText})</span>
                        </div>

                        <div class="w-[36px] flex items-center justify-center shrink-0">
                            ${iconSvg}
                        </div>

                        <div class="flex items-baseline justify-end gap-3 text-[18px] font-bold font-mono tracking-tight shrink-0 min-w-[96px] whitespace-nowrap">
                            <div class="text-[#e03131]">
                                <span>${displayMax}</span><span class="text-[12px] font-normal">℃</span>
                            </div>
                            <div class="text-[#007aff]">
                                <span>${displayMin}</span><span class="text-[12px] font-normal">℃</span>
                            </div>
                        </div>

                        <div class="w-[45px] text-right text-[15px] font-bold text-[#374151] font-mono shrink-0 whitespace-nowrap">
                            ${displayPop}
                        </div>

                        <div class="w-[24px] flex items-center justify-end shrink-0">
                            <span class="w-5 h-5 rounded-full border border-[#8e8e93] text-[#4b5563] text-[11px] font-bold flex items-center justify-center font-sans">
                                ${reliability}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            listContainer.innerHTML = listHtml;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        registration.update();
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
